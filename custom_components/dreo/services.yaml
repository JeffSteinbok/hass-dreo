set_rgbic_segments:
  name: Set RGBIC segment colors
  description: Set the RGBIC segment colors on a compatible Dreo 530S.
  fields:
    device_id:
      name: Device
      description: Select a compatible Dreo 530S purifier.
      required: true
      selector:
        device:
          filter:
            - integration: dreo
              model: DR-HAP010S
    colors:
      name: Segment colors
      description: Enter one #RRGGBB color for each segment in catalog order.
      required: true
      selector:
        text:
          multiple: true
