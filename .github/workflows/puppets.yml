name: Puppets

on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report intended mutations without applying them
        required: false
        default: false
        type: boolean

concurrency:
  group: puppets-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  reconcile:
    uses: JeffSteinbok/puppets/.github/workflows/reconcile.yml@9a6c12d0562edaa442e66dc5f2efeb9a02790f5d
    with:
      dry_run: ${{ inputs.dry_run || false }}
      caller_workflow: puppets.yml
    secrets:
      token: ${{ secrets.PUPPETS_TOKEN }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
