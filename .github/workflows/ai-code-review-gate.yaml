name: AI Code Review Gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  ai_review_present:
    name: AI review present
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Verify AI review exists
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });
            if (files.length === 0) {
              core.setFailed("Pull request has no file changes.");
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });

            const aiReviewerLogins = new Set([
              "github-copilot[bot]",
              "copilot-pull-request-reviewer[bot]",
              "coderabbitai[bot]"
            ].map((login) => login.toLowerCase()));

            const acceptedReviewStates = new Set(["APPROVED", "CHANGES_REQUESTED", "COMMENTED"]);
            // Copilot posts a COMMENTED review when it could not run (e.g. the requester's quota is
            // exhausted). That is not a review.
            const failedReviewPattern = /Copilot was unable to review this pull request/i;
            const aiReviews = reviews.filter((review) => {
              const reviewer = review.user?.login?.toLowerCase();
              return (
                reviewer &&
                aiReviewerLogins.has(reviewer) &&
                acceptedReviewStates.has(review.state) &&
                !failedReviewPattern.test(review.body || "")
              );
            });

            if (aiReviews.length > 0) {
              const reviewers = [...new Set(aiReviews.map((review) => review.user.login))].join(", ");
              core.info(`AI review detected from: ${reviewers}`);
              return;
            }

            // A maintainer's approval of the current head commit also satisfies the gate, so a
            // maintainer can review a PR themselves instead of paying for a Copilot review.
            const headSha = context.payload.pull_request.head.sha;
            const maintainerAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const maintainerApprovals = reviews.filter(
              (review) =>
                review.state === "APPROVED" &&
                review.commit_id === headSha &&
                maintainerAssociations.has(review.author_association)
            );

            if (maintainerApprovals.length > 0) {
              const approvers = [...new Set(maintainerApprovals.map((review) => review.user.login))].join(", ");
              core.info(`No AI review; maintainer approval of ${headSha} from: ${approvers}`);
            } else {
              core.setFailed(
                "No AI review or maintainer approval of the latest commit found. Request an AI review " +
                  "(for example, GitHub Copilot review) or have a maintainer approve, then re-run this check."
              );
            }
