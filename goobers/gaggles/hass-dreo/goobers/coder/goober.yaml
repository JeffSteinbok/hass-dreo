apiVersion: goobers.dev/v1alpha1
kind: Goober
metadata:
  name: coder
spec:
  gaggle: hass-dreo
  role: coder
  displayName: Coder
  # Markdown (with YAML frontmatter) defining behavior/persona/scope, resolved
  # relative to this goober definition directory (CFG-003, GBO-002).
  instructions: instructions.md
  harness: copilot
  model: auto
  harnessOptions: {}
  # Capability grants this goober holds. An agentic task may only use
  # capabilities in this set (ARCHITECTURE.md §5, SEC-042). The `implement`
  # task commits to the run branch, so it needs repo:push.
  capabilities:
    - repo:push
  skills:
    - implement
    - run-tests
  tools:
    - github
    - shell
  # Single-threaded to start; raise + redeploy to add concurrent replicas
  # (GBO-030).
  scaleFactor: 1
  workflows:
    - implementation
